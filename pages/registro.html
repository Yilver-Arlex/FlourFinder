<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <title>Registro FlourFinder</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">

        @theme {
            --color-app-bg-principal: #FFFAF0;
            --color-app-bg-secondary: #FDF5E6;
            --color-app-bg-tertiary: #F2E2C6;
            --color-app-text-principal: #2D1B14; 
            --color-app-white: #FFFAF0;
            --color-app-white-hover: #FDF5E6;
            --color-app-orange: #E67E22;
            --color-app-orange-hover: #D96B18;
            --color-app-primary: #D4A373;
            --color-app-skyn-color: #F5E0B7;
            --color-app-skyn-color-hover: #E8CE9D;

            --font-poppins-sans: "Poppins", sans-serif;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim-entrada {
            opacity: 0;
            animation: aparecer 0.7s forwards;
        }
    </style>
</head>

<body class="font-poppins-sans bg-app-bg-principal">
    <main>

        <!--Registro-->

        <section id="section-registrarse" class="flex flex-col justify-center items-center min-h-screen py-10 px-2">
            <div
                class="relative max-w-150 w-full flex flex-col justify-center items-center gap-16 sm:shadow-xl sm:rounded-4xl sm:py-15 sm:px-20 anim-entrada">
                <button class="absolute top-0 left-0 sm:top-5 sm:left-5 btn-back">
                    <img class="w-12 hover:scale-105 transition cursor-pointer" src="../img/MuyUtilizadas/btn-atras.avif" alt="">
                </button>
                <div class="flex flex-col gap-1 items-center justify-center">
                    <img class="w-20 md:w-25" src="../img/MuyUtilizadas/FlourFinder.avif" alt="">
                    <h2 class="font-bold text-2xl md:text-3xl">Registrarse</h2>
                </div>
                <form class="flex flex-col justify-center items-center gap-5 w-full">

                    <div class="flex flex-col justify-center items-start gap-1">
                        <div>
                            <label for="email-up" class="i-text">Email</label>
                            <span class="input-text-error"></span>
                        </div>
                        <input type="email"
                            class="border-red-200 border-1 rounded-lg focus:ring-gray-500 focus:ring-2 focus:outline-none px-3 py-1.5 focus:scale-105 transition-transform"
                            id="email-up">
                    </div>

                    <div class="flex flex-col justify-center items-start gap-1">
                        <div>
                            <label for="password-up" class="i-text">Contraseña</label>
                            <span class="input-text-error"></span>
                        </div>
                        <input type="password"
                            class="border-red-200 border-1 rounded-lg focus:ring-gray-500 focus:ring-2 focus:outline-none px-3 py-1.5 focus:scale-105 transition-transform"
                            id="password-up">
                    </div>

                    <div class="flex flex-col justify-center items-start gap-1">
                        <div>
                            <label for="identification-up" class="i-text">Identificación</label>
                            <span class="input-text-error"></span>
                        </div>
                        <input type="text"
                            class="border-red-200 border-1 rounded-lg focus:ring-gray-500 focus:ring-2 focus:outline-none px-3 py-1.5 focus:scale-105 transition-transform"
                            id="identification-up">
                    </div>
                    <button
                        class="mt-10 bg-app-skyn-color rounded-md py-2 px-5 hover:bg-app-skyn-color-hover hover:scale-105 transition hover:shadow-ms cursor-pointer">Registrarse</button>
                </form>

                <div class="flex gap-5 items-center justify-center">
                    <div class="w-35 h-0.5 bg-app-primary"></div>
                    <span>O</span>
                    <div class="w-35 h-0.5 bg-app-primary"></div>
                </div>
                <div class="flex flex-col items-center justify-center gap-3">
                    <button
                        class="border-app-primary border-1 flex justify-center items-center gap-5 py-1.5 px-15 rounded-md hover:scale-105 hover:shadow-sm transition cursor-pointer">
                        <img class="w-7" src="../img/registrarseEinicioDesesion/IconGoogleO.avif" alt="">
                        Iniciar con Google
                    </button>
                    <p>¿Ya tienes cuenta? <a class="text-app-orange hover:text-app-orange-hover transition"
                            href="./iniciarSesion.html">Iniciar Sesión</a></p>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/main.js"></script>
</body>

</html>
